name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (.NET 10 derleme)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Yakinda.slnx
      - run: dotnet build Yakinda.slnx --no-restore --configuration Release

  mobile:
    name: Mobil (TypeScript tip kontrolü)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      # Harita, ekran ve tarih seçici paketlerini SDK 58 uyumlu sürümlerle kurar
      - run: npm run setup
      # Expo bu dosyayı "expo start" sırasında üretir; CI'da elle oluşturulur (process.env tipleri için)
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit
