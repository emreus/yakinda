name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (.NET 10 derleme + testler)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Yakinda.slnx
      - run: dotnet build Yakinda.slnx --no-restore --configuration Release
      # Birim testleri + entegrasyon testleri (Testcontainers, runner'daki Docker'da PostGIS açar)
      - run: dotnet test Yakinda.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  mobile:
    name: Mobil (TypeScript tip kontrolü)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      # Harita, ekran ve tarih seçici paketlerini SDK 58 uyumlu sürümlerle kurar
      - run: npm run setup
      # Setup package.json'da bir sürümü değiştirdiyse burada görünür (boşsa repo güncel)
      - name: Setup'ın package.json'a yaptığı değişiklikler
        run: git --no-pager diff -- package.json
      # Expo bu dosyayı "expo start" sırasında üretir; CI'da elle oluşturulur (process.env tipleri için)
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit

  docker:
    name: Docker (imaj + sunucu kurulumu açılış testi)
    runs-on: ubuntu-latest
    env:
      # deploy/.env.example'daki zorunlu alanlar CI için doldurulur (kabuk değişkenleri .env dosyasını ezer)
      API_DOMAIN: ci.invalid
      POSTGRES_PASSWORD: ciPassword123
      JWT_SIGNING_KEY: ci-signing-key-0123456789abcdef0123456789abcdef
      COMPOSE: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.example
    steps:
      - uses: actions/checkout@v6
      - name: Compose dosyasını doğrula
        run: $COMPOSE config --quiet
      # Caddy hariç: CI'da gerçek alan adı yok, sertifika alınamaz
      - name: API imajını derle, veritabanı ve Redis ile başlat
        run: $COMPOSE up -d --build --wait db redis api
      - name: API açıldı mı (migration'lar dahil)
        run: |
          for i in $(seq 1 40); do
            if docker run --rm --network yakinda_default curlimages/curl -fsS http://api:8080/health; then
              docker run --rm --network yakinda_default curlimages/curl -fsS -o /dev/null -w "legal/privacy: %{http_code}\n" http://api:8080/legal/privacy
              docker run --rm --network yakinda_default curlimages/curl -fsS -o /dev/null -w "categories: %{http_code}\n" http://api:8080/api/categories
              exit 0
            fi
            sleep 3
          done
          exit 1
      - name: API logları
        if: always()
        run: $COMPOSE logs api | tail -60
