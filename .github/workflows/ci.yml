name: CI

on:
  push:
    branches: [master]
  pull_request:

# İşler depoyu yalnız okur (varsayılan token'a yazma yetkisi verilmez).
permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 10 derleme + testler)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Yakinda.slnx
      # Bilinen güvenlik açığı olan paket (dolaylı bağımlılıklar dahil) varsa listeler; yüksek/kritik ise işi durdurur
      - name: Güvenlik açığı olan NuGet paketleri
        run: |
          dotnet list Yakinda.slnx package --vulnerable --include-transitive 2>&1 | tee /tmp/nuget-audit.txt
          if grep -qE "(High|Critical)" /tmp/nuget-audit.txt; then
            echo "::error::Yüksek ya da kritik önemde güvenlik açığı olan NuGet paketi var (yukarıdaki listeye bak)."
            exit 1
          fi
      - run: dotnet build Yakinda.slnx --no-restore --configuration Release
      # Birim testleri + entegrasyon testleri (Testcontainers, runner'daki Docker'da PostGIS açar)
      - run: dotnet test Yakinda.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  mobile:
    name: Mobil (TypeScript tip kontrolü)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      # Harita, ekran ve tarih seçici paketlerini SDK 58 uyumlu sürümlerle kurar
      - run: npm run setup
      # Setup package.json'da bir sürümü değiştirdiyse burada görünür (boşsa repo güncel)
      - name: Setup'ın package.json'a yaptığı değişiklikler
        run: git --no-pager diff -- package.json
      # Expo bu dosyayı "expo start" sırasında üretir; CI'da elle oluşturulur (process.env tipleri için)
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit
      # Saf TypeScript yardımcılarının testleri (Node, .ts dosyalarını doğrudan çalıştırır)
      - name: Birim testleri
        run: node --test "src/**/*.test.mjs"
      # Uygulamaya giren (geliştirme araçları hariç) bağımlılıklardaki bilinen açıklar. Şimdilik bilgi amaçlı:
      # Expo/React Native sürümleri SDK'ya bağlı olduğu için düzeltme çoğu zaman SDK güncellemesiyle gelir.
      - name: Güvenlik açığı olan npm paketleri
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit yüksek önemde bulgu bildirdi (yukarıdaki listeye bak)."

  docker:
    name: Docker (imaj + sunucu kurulumu açılış testi)
    runs-on: ubuntu-latest
    env:
      # deploy/.env.example'daki zorunlu alanlar CI için doldurulur (kabuk değişkenleri .env dosyasını ezer)
      API_DOMAIN: ci.invalid
      POSTGRES_PASSWORD: ciPassword123
      APP_DB_PASSWORD: ciAppPassword456
      JWT_SIGNING_KEY: ci-signing-key-0123456789abcdef0123456789abcdef
      COMPOSE: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.example
    steps:
      - uses: actions/checkout@v6
      - name: Compose dosyasını doğrula
        run: $COMPOSE config --quiet
      # Caddy hariç: CI'da gerçek alan adı yok, sertifika alınamaz
      - name: API imajını derle, veritabanı ve Redis ile başlat
        run: $COMPOSE up -d --build --wait db redis api
      - name: API açıldı mı (migration'lar dahil)
        run: |
          for i in $(seq 1 40); do
            if docker run --rm --network yakinda_default curlimages/curl -fsS http://api:8080/health; then
              docker run --rm --network yakinda_default curlimages/curl -fsS -o /dev/null -w "legal/privacy: %{http_code}\n" http://api:8080/legal/privacy
              docker run --rm --network yakinda_default curlimages/curl -fsS -o /dev/null -w "categories: %{http_code}\n" http://api:8080/api/categories
              exit 0
            fi
            sleep 3
          done
          exit 1
      # Gerçek sunucuda (Kestrel) geçerli olan sınırlar ve başlıklar; test sunucusu bunları uygulamaz
      - name: Gövde boyutu sınırı, büyük görsel yükleme ve güvenlik başlıkları
        run: |
          api() { docker run --rm --network yakinda_default -v "$PWD/tmp-ci:/ci:ro" curlimages/curl -sS "$@"; }
          mkdir -p tmp-ci
          python3 - <<'PY'
          import json, struct
          # Yapısı geçerli ~2 MB JPEG (sunucu görüntüyü çözmez, yapıyı ve boyutu okur)
          sof = b"\xff\xc0" + struct.pack(">HBHHB", 17, 8, 600, 800, 3) + bytes([1, 0x22, 0, 2, 0x11, 1, 3, 0x11, 1])
          sos = b"\xff\xda" + struct.pack(">H", 12) + bytes([3, 1, 0, 2, 0x11, 3, 0x11, 0, 0x3F, 0])
          jpeg = b"\xff\xd8" + sof + sos + bytes(2 * 1024 * 1024) + b"\xff\xd9"
          open("tmp-ci/big.jpg", "wb").write(jpeg)
          open("tmp-ci/big.json", "w").write(json.dumps({"email": "x@test.local", "password": "a" * (2 * 1024 * 1024)}))
          PY
          chmod -R a+rX tmp-ci

          token=$(api -X POST http://api:8080/api/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"ci-smoke@test.local","password":"Sifre12345","displayName":"CI","acceptTerms":true}' \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["accessToken"])')

          code=$(api -o /dev/null -w '%{http_code}' -X PUT http://api:8080/api/users/me/avatar -H "Authorization: Bearer $token" -F 'file=@/ci/big.jpg')
          echo "2 MB görsel yükleme: $code"; [ "$code" = 200 ]

          code=$(api -o /dev/null -w '%{http_code}' -X POST http://api:8080/api/auth/login -H 'Content-Type: application/json' --data-binary @/ci/big.json)
          echo "2 MB JSON gövdesi: $code"; [ "$code" = 413 ]

          headers=$(api -D - -o /dev/null http://api:8080/legal/privacy)
          echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          if echo "$headers" | grep -qi '^server:'; then echo "Server başlığı sızıyor"; exit 1; fi
      - name: Uygulama veritabanına süper kullanıcı olarak bağlanmıyor
        run: |
          role=$($COMPOSE exec -T db psql -U postgres -d yakinda -tAc "SELECT rolsuper FROM pg_roles WHERE rolname = 'yakinda'")
          owner=$($COMPOSE exec -T db psql -U postgres -d yakinda -tAc "SELECT tableowner FROM pg_tables WHERE tablename = 'users'")
          echo "yakinda rolü süper kullanıcı mı: $role | users tablosunun sahibi: $owner"
          [ "$role" = "f" ] && [ "$owner" = "yakinda" ]
      - name: API logları
        if: always()
        run: $COMPOSE logs api | tail -60
