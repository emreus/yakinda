name: CodeQL

# Statik güvenlik analizi: kodu çalıştırmadan, bilinen açık kalıplarını (SQL/komut enjeksiyonu, yol geçişi,
# güvensiz veri akışı...) arar. Sonuçlar deponun Security → Code scanning sekmesinde ve PR'da görünür.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # her pazartesi: kod değişmese de yeni kurallarla yeniden tara

permissions:
  contents: read

jobs:
  analyze:
    name: Statik analiz (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
