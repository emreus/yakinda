services:
  db:
    # PostgreSQL 17 + PostGIS 3.5
    # Resmi PostGIS imajı yalnızca amd64 (Intel) için yayınlanıyor. platform satırı olmadan
    # Apple Silicon (M1/M2/M3...) Mac'lerde "no matching manifest for linux/arm64/v8" hatası alınır;
    # bu satırla Docker Desktop imajı emülasyonla (Rosetta) çalıştırır. Intel ve Linux x64'te etkisi yok.
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    container_name: yakinda-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: yakinda
      POSTGRES_USER: yakinda
      POSTGRES_PASSWORD: yakinda_dev
    ports:
      - "5432:5432"
    volumes:
      - yakinda-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yakinda -d yakinda"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Cache (L2) ve instance'lar arası cache senkronizasyonu (backplane, Pub/Sub)
    image: redis:8.6
    container_name: yakinda-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Geliştirme için sahte e-posta sunucusu: uygulamanın gönderdiği e-postalar (ör. şifre sıfırlama kodu)
  # gerçekten gönderilmez, http://localhost:8025 adresinde görünür.
  mailpit:
    image: axllent/mailpit:latest
    container_name: yakinda-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web arayüzü
    restart: unless-stopped

volumes:
  yakinda-pgdata:
